backend = "egl";
vsync = true;
blur-method = "dual_kawase";
blur-strength = 12;
blur-background = true;
inactive-opacity = 0.87;
active-opacity = 0.87;
detect-client-opacity = false;

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.95;
shadow-offset-x = -27;
shadow-offset-y = -15;
shadow-ignore-shaped = false;
corner-radius = 12;

rounded-corners-exclude = [ "class_g = 'ActrizIsla'", "class_g = 'ActrizIslaBajo'", "class_g = 'ActrizDock'", "class_g = 'ActrizBote'" ];
shadow-exclude = [ "class_g = 'ActrizIsla'", "class_g = 'ActrizIslaBajo'", "class_g = 'ActrizDock'", "class_g = 'ActrizBote'", "class_g = 'Dunst'", "name = 'Notification'" ];

wintypes:
{
  popup_menu = { blur-background = false; shadow = false; opacity = 0.90; };
  dropdown_menu = { blur-background = false; shadow = false; opacity = 0.90; };
  menu = { blur-background = false; shadow = false; opacity = 0.90; };
};
